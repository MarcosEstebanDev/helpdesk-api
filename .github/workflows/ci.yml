name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs viejos del mismo ref si llega uno nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    # Postgres real para los e2e (RLS no se puede mockear). El usuario `helpdesk`
    # es el owner/superusuario que corre las migraciones; el rol de aplicación
    # restringido `helpdesk_app` lo crea la propia migración (ADR-0010).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Redis para las colas de la fase 5 (BullMQ).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://helpdesk_app:helpdesk_app@localhost:5432/helpdesk?schema=public
      MIGRATION_DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk?schema=public
      REDIS_URL: redis://localhost:6379
      # Secretos de test, no de produccion: el CI solo necesita que sean validos
      # (>=32 chars) y distintos entre si para ejercitar el flujo de ADR-0011.
      JWT_ACCESS_SECRET: ci-access-secret-de-pruebas-no-usar-en-produccion
      JWT_REFRESH_SECRET: ci-refresh-secret-de-pruebas-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Apply migrations (crea rol de app + RLS)
        run: pnpm prisma:deploy

      - name: Lint
        run: pnpm lint:ci

      # `build` NO basta como comprobación de tipos: usa `tsconfig.build.json`,
      # que excluye a propósito los `*.spec.ts` y los `*.test-doubles.ts`. Sin
      # este paso, ampliar un puerto y olvidarse de su doble de prueba pasa el CI
      # entero en verde.
      - name: Typecheck (incluye tests y dobles)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # La IMAGEN se construye aparte porque `pnpm build` no la cubre: compila
      # con el node_modules del runner, donde el cliente de Prisma ya esta
      # generado, mientras que la imagen parte de una instalacion limpia. Por esa
      # diferencia el Dockerfile estuvo roto desde que Prisma entro al proyecto
      # (fase 2a) hasta la fase 10, con el CI en verde todo el tiempo. Es el
      # mismo hueco que cubrio el paso de typecheck: un comando que nadie ejecuta
      # no protege nada.
      - name: Build Docker image
        run: docker build -t helpdesk-api:ci .
